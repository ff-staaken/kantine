    payments:list("payments").filter(p=>p.m===mid).map(p=>({amount:p.amount, note:p.note, ts:p.ts})),
    rounds:Object.fromEntries([...new Set(bk.filter(b=>b.r).map(b=>b.r))].filter(r=>S.rounds[r]).map(r=>[r, S.rounds[r].reason||""])),
    events:list("events").filter(e=>e.date>=today()).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).map(e=>({id:e.id, title:e.title, date:e.date, time:e.time||"", price:e.price||0, deadline:e.deadline||"", desc:e.desc||"",
      persons:list("signups").filter(s=>s.e===e.id).reduce((a,s)=>a+(s.count||1),0)})),
    signups:list("signups").filter(s=>s.m===mid).map(s=>({e:s.e, count:s.count, note:s.note||""})) };
}
let pubTimer=null, pubBusy=false;
function publishSoon(){ clearTimeout(pubTimer); pubTimer=setTimeout(publishMembers, 45000); }
async function publishMembers(){
  if (!TOKEN || !DEK || pubBusy) return;
  if (PENDING.length){ publishSoon(); return; }
  pubBusy=true;
  try{
    const snaps={}; for (const [mid,code] of Object.entries(S.codes)) if (S.members[mid] && code) snaps[mid]=memberSnapshot(mid);
    const fp=await sha(JSON.stringify([snaps, S.codes, today()]));
    if (fp===ls.get("kantine.pubfp")) return;
    const at=Date.now(); const tree=[{path:"README.md", mode:"100644", type:"blob", content:"Verschlüsselte Kontoauszüge der Kantine. Nur mit dem persönlichen QR-Code lesbar.\n"}];
    for (const [mid,snap] of Object.entries(snaps)){ const {path,key}=await memberFile(S.codes[mid]); tree.push({path, mode:"100644", type:"blob", content:JSON.stringify(await seal(key, await gz(tenc.encode(JSON.stringify({...snap, at})))))}); }
    const t=await gh(`/repos/${OWNER}/${APPREPO}/git/trees`, {method:"POST", body:JSON.stringify({tree})});
    const c=await gh(`/repos/${OWNER}/${APPREPO}/git/commits`, {method:"POST", body:JSON.stringify({message:"Kontoauszüge aktualisiert", tree:t.sha, parents:[]})});
    try{ await gh(`/repos/${OWNER}/${APPREPO}/git/refs/heads/konten`, {method:"PATCH", body:JSON.stringify({sha:c.sha, force:true})}); }
    catch(e){ if (e.status===404 || e.status===422) await gh(`/repos/${OWNER}/${APPREPO}/git/refs`, {method:"POST", body:JSON.stringify({ref:"refs/heads/konten", sha:c.sha})}); else throw e; }
    ls.set("kantine.pubfp", fp);
  }catch(e){ console.warn("Kontoauszüge nicht veröffentlicht", e); publishSoon(); }
  finally{ pubBusy=false; }
}
function qrModal(mid){
  const m=S.members[mid]; if (!m) return;
  const code=S.codes[mid];
  if (!code){
    modal(`<h3>QR-Code für ${esc(m.name)}</h3><p style="margin:0">Mit dem persönlichen QR-Code sieht ${esc(firstName(m.name))} am Handy den eigenen Kontostand, die Buchungen und die nächsten Termine – ohne Anmeldung. Andere Konten sind darüber nicht sichtbar.</p>
      <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="qrMake">QR-Code erzeugen</button></div>`, r=>{
      r.querySelector("#qrMake").onclick=async()=>{ await makeCode(mid); qrModal(mid); render(); };
    });
    return;
  }
  const link=memberLink(code);
  modal(`<h3>QR-Code für ${esc(m.name)}</h3>
    <div class="qrbox">${qrSvg(link)}</div>
    <div class="linkbox" id="qrLink">${esc(link)}</div>
    <p class="muted small" style="margin:0">Nur an ${esc(firstName(m.name))} weitergeben. Wer den Link hat, sieht dieses Konto. Ist der Zettel verloren, erzeuge einen neuen Code – der alte funktioniert dann nicht mehr. Neue Codes und Buchungen erscheinen am Handy nach einigen Minuten.</p>
    <div class="actions"><button class="btn danger" id="qrNew" style="margin-right:auto">Neuen Code erzeugen</button><button class="btn" id="qrCopy">Link kopieren</button><button class="btn" id="qrPrint">Zettel drucken</button><button class="btn primary" data-close>Fertig</button></div>`, r=>{
    r.querySelector("#qrCopy").onclick=()=>copyText(link,"Persönlicher Link");
    r.querySelector("#qrPrint").onclick=()=>printCards([mid]);
    let armed=false;
    r.querySelector("#qrNew").onclick=async()=>{
      const b=r.querySelector("#qrNew");
      if (!armed){ armed=true; b.textContent="Alter Code wird ungültig – bestätigen"; return; }
      await makeCode(mid); toast("Neuer Code erzeugt. Der alte Link funktioniert nicht mehr."); qrModal(mid); render();
    };
  });
}
function printCards(ids){
  const unit=S.settings.unit||WEHR;
  let el=document.getElementById("printSheet"); if (!el){ el=document.createElement("div"); el.id="printSheet"; document.body.appendChild(el); }
  el.innerHTML = ids.filter(id=>S.codes[id]&&S.members[id]).map(id=>`<div class="pcard">${logoTag("plogo")}<div class="pu">${esc(unit)} · Kantine${CFG.untertitel?`<br>${esc(CFG.untertitel)}`:""}</div><div class="pn">${esc(S.members[id].name)}</div>${qrSvg(memberLink(S.codes[id]))}<div class="pt">Dein Kantinenkonto: mit der Handykamera scannen und als Lesezeichen speichern.<br>Persönlich – bitte nicht weitergeben.</div></div>`).join("");
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast("Drucken ist hier nicht möglich."); } }, 50);
}
async function printAll(){
  const ms=membersActive();
  for (const m of ms) if (!S.codes[m.id]) await makeCode(m.id);
  render(); printCards(ms.map(m=>m.id));
}

// ================= Gerät einrichten / anmelden =================
function setChrome(staff){ $("#tabs").hidden=!staff; $("#sync").hidden=!staff; }
function showMsg(title, text, extra){ $("#main").innerHTML=`<div class="login"><div class="empty"><b>${title}</b><span>${text}</span>${extra||""}</div></div>`; }
function showSetup(msg){
  MODE="login"; setChrome(false);
  $("#main").innerHTML=`<form class="login panel" id="setupForm" autocomplete="off">
      <img class="biglogo" src="${esc(CFG.logo||"")}" alt="Logo ${esc(WEHR)}" ${LOGO_OK?"":"hidden"}>
      ${ZEP_SVG}
      <div><div class="eyebrow">${esc(WEHR)} · Gerät verbinden</div><h2>Kantine öffnen</h2></div>
      <p class="muted" style="margin:0">Einmal pro Gerät – z. B. Tablet auf der Wache oder PC zu Hause.</p>
      ${msg?`<div class="note">${esc(msg)}</div>`:""}
      <label class="f">Zugangsschlüssel (GitHub)<input type="password" id="suToken" required placeholder="github_pat_…" autocomplete="off"><span class="hint">Steht in der Anleitung, Schritt 3. Bekommst du vom Kassenwart.</span></label>
      <label class="f">Kantinen-Passwort<input type="password" id="suPw" required autocomplete="current-password"></label>
      <label class="f">Name dieses Geräts<input type="text" id="suDev" maxlength="40" placeholder="z. B. Tablet Wache, PC Kassenwart" value="${esc(ls.get("kantine.devname")||"")}"><span class="hint">Wird bei jeder Buchung vermerkt.</span></label>
      <label class="row" style="font-weight:600"><input type="checkbox" id="suKeep" checked> Auf diesem Gerät angemeldet bleiben</label>
      <button class="btn primary" type="submit" id="suBtn">Verbinden</button>
    </form>`;
  $("#setupForm").onsubmit=async e=>{ e.preventDefault(); e.stopPropagation();
    const b=$("#suBtn"); b.disabled=true; b.textContent="Verbinde …";
    TOKEN=$("#suToken").value.trim(); const pw=$("#suPw").value, keep=$("#suKeep").checked, devname=$("#suDev").value.trim()||"Gerät";
    try{
      const cur=await ghRead(DATAREPO, "data.enc");
      if (!cur){ b.disabled=false; b.textContent="Verbinden"; return showCreate(pw, keep, devname); }
      const f=JSON.parse(tdec.decode(cur.bytes));
      let raw; try{ raw=await unseal(await kek(pw, unb64(f.salt)), f.wrap); }catch(err){ throw {pw:true}; }
      DEK=await importDek(raw); HDR={salt:f.salt, wrap:f.wrap};
      REMOTE={sha:cur.sha, state:await decState(tdec.decode(cur.bytes))};
      await remember(raw, keep, devname); PENDING=[]; startStaff();
    }catch(err){
      b.disabled=false; b.textContent="Verbinden";
      toast(err.pw ? "Kantinen-Passwort falsch." : err.status===401 ? "Zugangsschlüssel ungültig oder abgelaufen." : (err.status===403||err.status===404) ? "Der Schlüssel hat keinen Zugriff auf das Daten-Repository (siehe Anleitung, Schritt 3)." : "Verbindung fehlgeschlagen. Internet prüfen.");
    }
  };
}
function showCreate(pw, keep, devname){
  modal(`<h3>Neue Kantine anlegen</h3><p style="margin:0">Im Daten-Repository <b>${esc(OWNER)}/${esc(DATAREPO)}</b> gibt es noch keine Kantinendaten. Soll eine neue, leere Kantine angelegt werden?</p>
    <label class="f">Kantinen-Passwort wiederholen<input type="password" id="crPw2"><span class="hint">Mindestens 10 Zeichen. Gut aufbewahren – ohne Passwort sind die Daten nicht lesbar.</span></label>
    <label class="f">Admin-PIN (4–6 Ziffern)<input type="password" id="crPin" inputmode="numeric" maxlength="6"><span class="hint">Sperrt die Verwaltung (Preise, Geld, Abrechnung).</span></label>
    <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="crOk">Anlegen</button></div>`, r=>{
    r.querySelector("#crOk").onclick=async()=>{
      if (pw.length<10){ toast("Das Kantinen-Passwort braucht mindestens 10 Zeichen."); return; }
      if (r.querySelector("#crPw2").value!==pw){ toast("Die Passwörter stimmen nicht überein."); return; }
      const pin=r.querySelector("#crPin").value.trim(); if (!/^\d{4,6}$/.test(pin)){ toast("Die Admin-PIN braucht 4 bis 6 Ziffern."); return; }
      r.querySelector("#crOk").disabled=true;
      try{
        const key=await crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
        const raw=new Uint8Array(await crypto.subtle.exportKey("raw", key)); DEK=key; HDR=await newHeader(pw, raw);
        const st=emptyState(); st.settings={pinHash:await sha(pin)};
        const res=await ghWrite(DATAREPO, "data.enc", tenc.encode(await encState(st)), null, "Kantine angelegt");
        REMOTE={sha:res.content.sha, state:st}; PENDING=[];
        await remember(raw, keep, devname); closeModal(); UI.unlocked=true; UI.unlockAt=Date.now(); startStaff();
      }catch(e){ toast("Anlegen fehlgeschlagen. Hat der Zugangsschlüssel Schreibrechte?"); r.querySelector("#crOk").disabled=false; }
    };
  });
}
async function remember(raw, keep, devname){
  const store = keep ? ls : ss;
  store.set("kantine.token", TOKEN); store.set("kantine.dek", b64(raw)); ls.set("kantine.devname", devname);
  if (!keep){ ls.set("kantine.token", null); ls.set("kantine.dek", null); }
  S.email=devname;
}
function startStaff(){
  S.email = ls.get("kantine.devname") || "Gerät";
  S.role="team"; S.canEdit=true; S.canWrite=true; S.db=DB; S.assets=assetsAdapter;
  UI.tlocked = !!(S.settings && S.settings.teamPinHash);
  rebuild(); UI.tlocked = !!S.settings.teamPinHash;
  MODE="staff"; setChrome(true); updSync(); route(); syncNow();
}
function pwModal(){
  modal(`<h3>Kantinen-Passwort ändern</h3><p class="muted" style="margin:0">Gilt danach für alle neuen Anmeldungen. Bereits verbundene Geräte bleiben verbunden.</p>
    <label class="f">Neues Passwort<input type="password" id="pw1" autocomplete="new-password"><span class="hint">Mindestens 10 Zeichen.</span></label>
    <label class="f">Wiederholen<input type="password" id="pw2" autocomplete="new-password"></label>
    <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="pwSave">Speichern</button></div>`, r=>{
    r.querySelector("#pwSave").onclick=async()=>{
      const a=r.querySelector("#pw1").value, b=r.querySelector("#pw2").value;
      if (a.length<10){ toast("Das Passwort braucht mindestens 10 Zeichen."); return; }
      if (a!==b){ toast("Die Passwörter stimmen nicht überein."); return; }
      HDR=await newHeader(a, new Uint8Array(await crypto.subtle.exportKey("raw", DEK))); needWrite=true;
      closeModal(); await syncNow(); toast(syncErr?"Gespeichert – wird beim nächsten Abgleich übertragen.":"Kantinen-Passwort geändert.");
    };
  });
}
function logoutDevice(){
  const n=PENDING.length;
  confirmBox("Gerät abmelden", n?`<b>Achtung: ${n} Änderungen sind noch nicht abgeglichen</b> und gehen verloren. Erst mit Internet „Jetzt abgleichen“.`:"Danach müssen Zugangsschlüssel und Kantinen-Passwort auf diesem Gerät neu eingegeben werden.", "Abmelden", async()=>{
    ["kantine.token","kantine.dek","kantine.cache","kantine.pubfp"].forEach(k=>{ ls.set(k,null); ss.set(k,null); });
    location.hash=""; location.reload();
  }, true);
}

// ================= Kameraden-Ansicht (persönlicher Code) =================
let MV=null, mvCode="";
function mvBalance(){ return (MV.carry||0) + MV.payments.reduce((s,p)=>s+(p.amount||0),0) - MV.bookings.reduce((s,b)=>s+(b.price||0)*(b.qty||1),0); }
async function memberLoad(){
  try{
    const {path,key}=await memberFile(mvCode);
    const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${APPREPO}/konten/${path}?t=${Date.now()}`, {cache:"no-store"});
    if (r.status===404){ showMsg("Dieser Link ist nicht (mehr) gültig.","Wurde der QR-Code gerade erst erzeugt, dauert es ein paar Minuten, bis das Konto hier erscheint. Sonst wurde ein neuer Code erzeugt – bitte beim Kassenwart einen neuen Zettel holen."); return; }
    if (!r.ok) throw new Error(r.status);
    MV=JSON.parse(tdec.decode(await gunz(await unseal(key, await r.json()))));
  }catch(e){ showMsg("Keine Verbindung.","Bitte Internetverbindung prüfen und die Seite neu laden."); return; }
  MV.bookings=MV.bookings||[]; MV.payments=MV.payments||[]; MV.events=MV.events||[]; MV.signups=MV.signups||[];
  memberRender();
}
function memberRender(){
  if (MV.unit) $("#unitName").textContent=MV.unit;
  document.title="Mein Kantinenkonto";
  const bal=mvBalance();
  const tx=[...MV.bookings.map(b=>({ts:b.ts, txt:`${b.qty}× ${esc(b.n)}${b.r?` <span class="pill warn">Runde${MV.rounds?.[b.r]?` · ${esc(MV.rounds[b.r])}`:""}</span>`:""}`, amt:-(b.price*(b.qty||1))})),
            ...MV.payments.map(p=>({ts:p.ts, txt:esc(p.note||"Gutschrift"), amt:p.amount}))].sort((a,b)=>b.ts-a.ts);
  const ms0=new Date(); ms0.setDate(1); ms0.setHours(0,0,0,0);
  const month=MV.bookings.filter(b=>b.ts>=ms0.getTime()).reduce((s,b)=>s+b.price*(b.qty||1),0);
  const mine=e=>MV.signups.find(s=>s.e===e.id);
  $("#main").innerHTML=`<div class="stack" style="max-width:720px;margin:0 auto">
    <div><div class="eyebrow">Mein Kantinenkonto</div><h2>${esc(MV.name)}</h2></div>
    <div class="panel row between" style="align-items:flex-end">
      <div><div class="eyebrow">Kontostand</div><div class="bigbal num ${bal<0?"neg":"pos"}">${eur(bal)}</div>
      <div class="muted">${bal<0?"Wird mit deiner nächsten Aufwandsentschädigung verrechnet.":bal>0?"Guthaben.":"Alles verrechnet."}</div></div>
      <div class="kpi" style="min-width:160px"><span class="eyebrow">Diesen Monat</span><b class="num">${eur(month)}</b></div></div>
    ${MV.events.length?`<div class="section"><h3>Nächste Termine</h3>${MV.events.map(e=>{const d=new Date(e.date+"T12:00:00"); const s=mine(e); return `<article class="ev">
      <div class="date"><div class="w">${d.toLocaleDateString("de-DE",{weekday:"short"})}</div><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString("de-DE",{month:"short"})}</div></div>
      <div class="body"><div class="row between"><h3>${esc(e.title)}</h3><span class="pill ${e.persons?"ok":"neutral"}">${e.persons} ${e.persons===1?"Person":"Personen"}</span></div>
      <div class="muted">${e.time?`${esc(e.time)} Uhr · `:""}${e.price?`${eur(e.price)} pro Person`:"Kostenlos"}${e.deadline?` · Anmeldung bis ${dDate(e.deadline)}`:""}</div>
      ${e.desc?`<div>${esc(e.desc).replace(/\n/g,"<br>")}</div>`:""}
      ${s?`<div class="pill ok" style="align-self:flex-start">Du bist dabei${s.count>1?` mit ${s.count} Personen`:""}</div>`:`<div class="muted small">Anmelden beim Kantinenteam.</div>`}</div></article>`}).join("")}</div>`:""}
    <div class="panel section"><h3>Buchungen</h3>
      ${tx.length?`<ul class="list">${tx.slice(0,80).map(t=>`<li><span class="grow">${t.txt}<br><span class="muted small">${tsStr(t.ts)}</span></span><b class="num ${t.amt<0?"":"pos"}">${eurS(t.amt)}</b></li>`).join("")}</ul>`:`<p class="muted" style="margin:0">Seit dem letzten Abschluss keine Buchungen.</p>`}
      ${MV.carry?`<p class="muted" style="margin:0">Übertrag aus früheren Abschlüssen: <b class="num">${eurS(MV.carry)}</b></p>`:""}</div>
    <p class="muted small" style="margin:0">Stand: ${MV.at?tsStr(MV.at):"–"}. Neue Buchungen erscheinen nach einigen Minuten. Diese Seite als Lesezeichen speichern – der Link ist persönlich, bitte nicht weitergeben.</p>
  </div>`;
}

// ================= Start =================
window.__kantine = { syncNow:()=>syncNow(), publish:()=>publishMembers(), pending:()=>PENDING.length };
async function boot(){
  const m=location.hash.match(/^#k=([A-Za-z0-9_-]{24,})$/);
  const ok = OWNER && APPREPO && DATAREPO && !/DEIN/i.test(OWNER+APPREPO+DATAREPO) && window.crypto && crypto.subtle && window.CompressionStream;
  if (!ok){ setChrome(false); showMsg("Die Kantine ist noch nicht eingerichtet.", window.CompressionStream?"In der Datei config.js fehlen die Namen der Repositories. Siehe ANLEITUNG.md.":"Dieser Browser ist zu alt. Bitte einen aktuellen Chrome, Edge, Firefox oder Safari verwenden."); return; }
  if (m){ MODE="member"; setChrome(false); mvCode=m[1]; showMsg("Dein Konto wird geladen …",""); await memberLoad();
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") memberLoad(); }); return; }
  TOKEN = ls.get("kantine.token") || ss.get("kantine.token") || "";
  const dk = ls.get("kantine.dek") || ss.get("kantine.dek");
  if (!TOKEN || !dk){ showSetup(); return; }
  try{ DEK=await importDek(unb64(dk)); }catch(e){ showSetup(); return; }
  await loadCache();
  startStaff();
}
let raf=0; function schedule(){ if (raf) return; raf=requestAnimationFrame(()=>{ raf=0; render(); }); }
boot();
})();
