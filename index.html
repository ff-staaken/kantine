<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1b2756">
<title>Kantine FF Staaken</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" id="favicon">
<link rel="apple-touch-icon" href="logo.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky header with warning-stripe band and tabs; kiosk = big tap tiles, admin = sub-tabs with dense tables. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f5f6f8; --ink:#15191e; --muted:#5b6570; --line:#d6dbe1;
  --red:#d2161e; --red-ink:#ffffff; --red-soft:#fbe7e8; --bar:#e8898d; --grid:#e3e6ea;
  --navy:#1b2756; --navy-2:#24336b; --navy-ink:#ffffff; --navy-muted:#c3cbe6; --flame:#f7b21b;
  --ok:#1d7a4b; --ok-soft:#e3f3ea; --warn:#8f5400; --warn-soft:#fdf0d9; --bad:#b0151b; --bad-soft:#fbe7e8;
  --op:#1f4f8a; --op-soft:#e4ecf7;
  --stripe-a:#d2161e; --stripe-b:#f7b21b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --ink:#edf0f3; --muted:#9aa4af; --line:#2e353d;
  --red:#e6363d; --red-ink:#ffffff; --red-soft:#3a1c1e; --bar:#8e3a3e; --grid:#2a3036;
  --navy:#111836; --navy-2:#1a2449; --navy-ink:#ffffff; --navy-muted:#a9b3d6; --flame:#f7b21b;
  --ok:#4fc58a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2b12; --bad:#ff6b70; --bad-soft:#3a1c1e;
  --op:#8fb6ec; --op-soft:#1b2a3f;
  --stripe-a:#e6363d; --stripe-b:#f7b21b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --ink:#edf0f3; --muted:#9aa4af; --line:#2e353d;
  --red:#e6363d; --red-ink:#ffffff; --red-soft:#3a1c1e; --bar:#8e3a3e; --grid:#2a3036;
  --navy:#111836; --navy-2:#1a2449; --navy-ink:#ffffff; --navy-muted:#a9b3d6; --flame:#f7b21b;
  --ok:#4fc58a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2b12; --bad:#ff6b70; --bad-soft:#3a1c1e;
  --op:#8fb6ec; --op-soft:#1b2a3f;
  --stripe-a:#e6363d; --stripe-b:#f7b21b; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.brand{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"l z r";align-items:center;gap:8px 16px;padding-block:8px}
.b-left{grid-area:l;display:flex;align-items:center;gap:10px;min-width:0}
.b-right{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;text-align:right}
.brand h1{grid-area:z;justify-self:center}
@media (max-width:760px){.brand{grid-template-columns:1fr auto;grid-template-areas:"z z" "l r"}.brand .zep{height:58px}}
.brand .unit small{display:block;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--flame);margin-top:2px}
.brand .logo{height:52px;width:auto;max-width:72px;object-fit:contain;display:block}
.login .biglogo{height:96px;width:auto;max-width:60%;object-fit:contain;align-self:center}
.brand h1{margin:0;line-height:0}
.zep{display:block;height:72px;width:auto;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login .zep{height:auto;width:min(320px,90%);align-self:center}
.brand .unit{color:var(--navy-muted);font-weight:600;font-size:.95rem}
.sync{font-size:.8rem;color:var(--navy-muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--stripe-a) 0 12px,var(--stripe-b) 12px 24px)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--navy-muted);font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;padding:8px 14px 10px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--navy-ink);border-bottom-color:var(--flame)}
nav.tabs a:hover{color:var(--navy-ink)}
nav.tabs a:focus-visible{outline:2px solid var(--flame);outline-offset:-2px}

main{padding-block:20px 120px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tile:focus-visible,.ptile:focus-visible,.bcol:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{min-height:34px;padding:5px 10px;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.alarm{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=password],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px;width:100%}
input[type=file]{width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.seg{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;scrollbar-width:none}
.seg button{flex:none;border:0;background:transparent;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)} .pill.op{background:var(--op-soft);color:var(--op)}
.neg{color:var(--bad)} .pos{color:var(--ok)}

/* Kiosk */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;min-height:76px;font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.1;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow-wrap:anywhere}
.tile:hover{border-color:var(--red)}
.tile:active{transform:scale(.98)}
.tile .sub{font-family:var(--f-body);font-size:.82rem;font-weight:600;color:var(--muted)}
.tile.op{border-color:var(--op);background:var(--op-soft)}
.tile.round{border-color:var(--warn);background:var(--warn-soft)}
.tile .tag{font-family:var(--f-body);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tile.op .tag{color:var(--op)} .tile.round .tag{color:var(--warn)}
.tile .pend{position:absolute;top:8px;right:8px;background:var(--warn);color:var(--surface);font-family:var(--f-body);font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.special{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.addtile{border-style:dashed;background:transparent;font-size:1.1rem;color:var(--muted)}
.pending{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pending b{color:var(--warn)}
.who{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.who.op{border-color:var(--op);background:var(--op-soft)} .who.round{border-color:var(--warn);background:var(--warn-soft)}
.who .name{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;text-transform:uppercase}
.who .bal{margin-left:auto;text-align:right}
.who .bal b{font-size:1.4rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ptile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 12px;min-height:112px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.ptile.sel{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.ptile .pn{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere;padding-right:30px}
.ptile .pp{font-weight:600}
.ptile .ps{font-size:.8rem;color:var(--muted);margin-top:auto;padding-right:40px}
.ptile .ps.low{color:var(--warn);font-weight:600}
.ptile .ps.out,.ptile .ps.exp{color:var(--bad);font-weight:700}
.badge{position:absolute;top:8px;right:8px;min-width:34px;height:34px;border-radius:17px;background:var(--red);color:var(--red-ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;padding:0 8px}
.minus{position:absolute;bottom:8px;right:8px;width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface-2);font-size:1.3rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cartbar{position:sticky;bottom:0;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cartbar .sum{font-family:var(--f-display);font-weight:700;font-size:1.6rem}
.cartbar .btn.primary{margin-left:auto;font-size:1.15rem;min-height:52px;padding:10px 26px}
.wake{font-size:.78rem;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 9px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list li .grow{flex:1;min-width:0}

.bigbal{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.kpi .hint{display:block}

/* Year review */
.review{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fact b{display:block;font-family:var(--f-display);font-size:2.6rem;line-height:1;font-weight:700}
.fact span{color:var(--muted);font-weight:600}

/* Chart */
.chart{position:relative;height:220px;padding:8px 0 28px 48px}
.chart .gl{position:absolute;left:48px;right:0;border-top:1px solid var(--grid)}
.chart .gl span{position:absolute;right:calc(100% + 6px);top:-.6em;font-size:.75rem;color:var(--muted);white-space:nowrap}
.chart .bars{position:absolute;left:48px;right:0;top:8px;bottom:28px;display:flex;align-items:flex-end;gap:2px}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:none;border:0;padding:0 2px;cursor:pointer;position:relative;min-width:0}
.bcol .bar{width:100%;max-width:44px;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.bcol[aria-pressed="true"] .bar{background:var(--red)}
.bcol .bl{position:absolute;top:100%;margin-top:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.bcol[aria-pressed="true"] .bl{color:var(--ink);font-weight:700}
.bcol .tip{position:absolute;bottom:calc(var(--h) + 6px);background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none}
.bcol:hover .tip,.bcol:focus-visible .tip,.bcol[aria-pressed="true"] .tip{opacity:1}
.chart-wrap{overflow-x:auto}
.chart-inner{min-width:480px}

/* Events */
.ev{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.date{background:var(--red);color:var(--red-ink);border-radius:8px;text-align:center;padding:8px 4px;align-self:start}
.date .d{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.date .m{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.date .w{font-size:.75rem;opacity:.85}
.ev.past .date{background:var(--surface-2);color:var(--muted)}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.88rem}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:1.1rem}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-weight:600;font-size:.92rem}
.receipt{max-width:100%;max-height:70vh;border-radius:8px;border:1px solid var(--line);align-self:center}

/* Modal & toast */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal.wide{max-width:940px}
.modal td input{min-height:36px;padding:6px 8px;width:110px}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow input{width:84px}
.mrow input[type=date]{width:140px}
@media (max-width:520px){.mrow{grid-template-columns:1fr 1fr}.mrow>span{grid-column:1/-1}.mrow input,.mrow input[type=date]{width:100%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px 12px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto;width:100%}
.pinpad button{min-height:58px;font-size:1.4rem;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.pindots{display:flex;gap:10px;justify-content:center}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.f{background:var(--ink);border-color:var(--ink)}
/* Login, Kameraden-Ansicht, QR & Druck */
.login{max-width:400px;margin:24px auto 0;display:flex;flex-direction:column;gap:14px}
.qrbox{background:#fff;padding:10px;border-radius:10px;align-self:center;width:220px;max-width:100%}
.qrbox svg{display:block;width:100%;height:auto}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
#printSheet{display:none}
@media print{
  body{background:#fff!important;color:#000!important}
  body>*:not(#printSheet){display:none!important}
  body::before{display:none!important}
  #printSheet{display:grid!important;grid-template-columns:repeat(3,1fr);gap:0;font-family:var(--f-body)}
  .pcard{border:1px dashed #888;padding:8mm 6mm;text-align:center;break-inside:avoid;display:flex;flex-direction:column;gap:2mm;align-items:center}
  .pcard .pn{font-family:var(--f-display);font-weight:700;font-size:15pt;text-transform:uppercase}
  .pcard .pu{font-size:8pt;color:#444}
  .pcard .plogo{height:12mm;width:auto;object-fit:contain}

}

@media (max-width:520px){.who .name{font-size:1.6rem}.bigbal{font-size:2.6rem}.ev{grid-template-columns:58px 1fr}.fact b{font-size:2.1rem}}
</style>
</head>
<body>
<header class="top">
  <div class="gut"><div class="wrap brand">
    <div class="b-left"><img class="logo" id="logo" alt="" hidden><span class="unit"><span id="unitName">Freiwillige Feuerwehr Staaken</span><small id="unitSub" hidden></small></span></div>
    <h1><span class="sr">Kantine</span><svg class="zep" viewBox="0 0 260 74" role="img" aria-label="Kantine" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 37 L6 14 L22 14 L44 30 Z M30 37 L6 60 L22 60 L44 44 Z" fill="#6b7280" stroke="#0e1014" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 37 L2 31 L2 43 Z" fill="#6b7280" stroke="#0e1014" stroke-width="2" stroke-linejoin="round"/>
      <rect x="150" y="56" width="34" height="10" rx="3" fill="#6b7280" stroke="#0e1014" stroke-width="2"/>
      <path d="M156 56 V52 M178 56 V52" stroke="#0e1014" stroke-width="2"/>
      <ellipse cx="136" cy="36" rx="120" ry="24" fill="#f3f4f6" stroke="#0e1014" stroke-width="3"/>
      <path d="M40 30 Q136 22 232 30 M40 42 Q136 50 232 42" fill="none" stroke="#c7cad1" stroke-width="2"/>
      <path d="M70 15 V57 M110 12.5 V59.5 M162 12.5 V59.5 M202 15 V57" stroke="#d5d8de" stroke-width="2"/>
      <text x="138" y="47" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="33" letter-spacing="2" fill="#0e1014">KANTINE</text>
    </svg></h1>
    <div class="b-right"><span class="wake" id="wake" hidden>Bildschirm bleibt an</span>
    <span class="sync" id="sync"><i class="dot" id="syncDot"></i><span id="syncText">Verbinde …</span></span></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Bereiche">
    <a href="#kiosk" data-v="kiosk">Strichliste</a>
    <a href="#termine" data-v="termine">Termine</a>
    <a href="#lager" data-v="lager">Lager</a>
    <a href="#statistik" data-v="statistik">Statistik</a>
    <a href="#verwaltung" data-v="verwaltung">Verwaltung</a>
  </nav></div></div>
</header>
<main class="gut"><div class="wrap" id="main"><div class="empty"><b>Kantine wird geladen …</b><span>Mitglieder, Artikel und Buchungen kommen gleich.</span></div></div></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
(() => {
"use strict";
// ================= State =================
const COLS = ["members","products","bookings","payments","events","signups","shopping","ops","rounds","cash","stats","settlements"];
const S = { codes:{}, role:null, email:"", live:false, settings:{}, loaded:new Set(), confirmed:new Set(), db:null, user:null, dl:null, assets:null, canWrite:null, canEdit:false, readOnly:false, offline:false, failed:false };
COLS.forEach(c => S[c] = {});
const UI = { view:"kiosk", sel:null, carts:{}, search:"", unlocked:false, unlockAt:0, debtOnly:false, showPast:false, meId:null, openEvent:null,
  adminTab:"konten", statProd:"", statMeasure:"q", statMonth:null, year:new Date().getFullYear(), cashYear:new Date().getFullYear(), opYear:new Date().getFullYear(), lastAct:Date.now() };
const CATS = ["Getränke","Heißgetränke","Essen","Snacks","Sonstiges"];
const OPKINDS = ["Einsatz","Übung","Dienstabend","Sonstiges"];
const CASHCATS = ["Einkauf Kantine","Einzahlung Mitglied","Pfandrückgabe","Veranstaltung","Spende","Sonstiges"];
const VIEWS = ["kiosk","konto","termine","lager","statistik","verwaltung"];
const DAY = 864e5;

let MODE="boot";
const CFG = window.KANTINE_CONFIG || {};
const WEHR = CFG.wehr || "Freiwillige Feuerwehr";
let LOGO_OK = false;
(()=>{ const img=document.getElementById("logo"); if (!CFG.logo){ document.getElementById("favicon")?.remove(); return; }
  img.onload=()=>{ LOGO_OK=true; img.hidden=false; document.querySelectorAll(".biglogo").forEach(x=>{ x.src=img.src; x.hidden=false; }); };
  img.onerror=()=>{ img.hidden=true; document.getElementById("favicon")?.remove(); };
  if (CFG.untertitel){ const u=document.getElementById("unitSub"); u.textContent=CFG.untertitel; u.hidden=false; }
  img.src=CFG.logo; document.getElementById("unitName").textContent=WEHR; document.title="Kantine "+(CFG.kurz||WEHR); })();
const ZEP_SVG = (document.querySelector(".brand h1 svg")||{}).outerHTML || "";
const logoTag = cls => LOGO_OK ? `<img class="${cls}" src="${esc(CFG.logo)}" alt="Logo ${esc(WEHR)}">` : "";
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} } };
UI.meId = ls.get("kantine.me");
try{ UI.carts = JSON.parse(ls.get("kantine.carts")||"{}") || {}; }catch(e){ UI.carts={}; }
for (const [k,c] of Object.entries(UI.carts)) if (!c || Date.now()-(c.ts||0) > DAY || !Object.keys(c.items||{}).length) delete UI.carts[k];
const saveCarts = () => ls.set("kantine.carts", JSON.stringify(UI.carts));

// ================= Helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const nf = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const eur = c => fmt.format((c||0)/100);
const eurS = c => (c>0?"+":"") + eur(c);
function parseEur(s){ s=String(s||"").trim().replace(/\s|€/g,""); if(!s) return NaN; if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const v=Number(s); return isFinite(v)? Math.round(v*100) : NaN; }
const centsIn = c => (c/100).toFixed(2).replace(".",",");
const deTs = new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const tsStr = t => deTs.format(new Date(t));
const dDate = s => s ? new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
const isoLocal = d => { d=new Date(d); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const today = () => isoLocal(Date.now());
const ymOf = ts => isoLocal(ts).slice(0,7);
const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const ymLabel = (ym, long) => { const [y,m]=ym.split("-").map(Number); return long ? new Date(y,m-1,15).toLocaleDateString("de-DE",{month:"long",year:"numeric"}) : MONTHS[m-1]+(m===1?" "+String(y).slice(2):""); };
const byName = (a,b) => (a.name||"").localeCompare(b.name||"","de",{sensitivity:"base"});
const list = col => Object.entries(S[col]).map(([id,d]) => ({id,...d}));
const membersActive = () => list("members").filter(m => m.active !== false).sort(byName);
const productsActive = () => list("products").filter(p => p.active !== false).sort((a,b)=>(CATS.indexOf(a.cat)-CATS.indexOf(b.cat)) || byName(a,b));
const mName = id => S.members[id]?.name || "Unbekannt";
const isProd = b => b.p && !String(b.p).startsWith("event:");
const firstName = n => { n=String(n||"").trim(); if (n.includes(",")){ const v=n.split(",")[1].trim(); return v ? v.split(/\s+/)[0] : n.split(",")[0]; } return n.split(/\s+/)[0]; };

function balance(mid){
  let b = S.members[mid]?.carry || 0;
  for (const p of Object.values(S.payments)) if (p.m===mid) b += p.amount||0;
  for (const k of Object.values(S.bookings)) if (k.m===mid) b -= (k.price||0)*(k.qty||1);
  return b;
}
function lastActivity(mid){ let t=0; for (const k of Object.values(S.bookings)) if (k.m===mid && k.ts>t) t=k.ts; for (const p of Object.values(S.payments)) if (p.m===mid && p.ts>t) t=p.ts; return t; }
function soldSince(pid, at){ let s=0; for (const b of Object.values(S.bookings)) if (b.p===pid && (b.ts||0) > (at||0)) s += b.qty||1; return s; }
const stock = pid => { const p=S.products[pid]; return p ? (p.base||0) - soldSince(pid, p.baseAt) : 0; };
const empties = pid => { const p=S.products[pid]; return p && p.pfand ? Math.max(0,(p.emptyBase||0) + soldSince(pid, p.emptyAt||p.baseAt)) : 0; };
function stockState(p){ if (p.track===false) return "none"; const s=stock(p.id); if (s<=0) return "out"; if (s<=(p.min||0)) return "low"; return "ok"; }
function units(n, crate){ if (!(crate>1) || n<=0) return nf.format(n)+(crate>1?" Fl.":""); const k=Math.floor(n/crate), r=n%crate; return `${k} ${k===1?"Kasten":"Kästen"}${r?` + ${r} Fl.`:""}`; }
function mhdState(p){ if (!p.mhd) return null; const d=(new Date(p.mhd+"T12:00:00") - new Date(today()+"T12:00:00"))/DAY; return d<0?"exp":d<=7?"soon":"ok"; }
function mhdText(p){ const s=mhdState(p); if(!s) return ""; const d=Math.round((new Date(p.mhd+"T12:00:00") - new Date(today()+"T12:00:00"))/DAY); return s==="exp"?`MHD abgelaufen (${dDate(p.mhd)})`: d===0?"MHD heute": `MHD in ${d} ${d===1?"Tag":"Tagen"}`; }

// Einsatz / Runde
function opTotals(oid){
  const o=S.ops[oid]||{}; const items={...(o.carry?.items||{})}; let total=o.carry?.total||0;
  for (const b of Object.values(S.bookings)) if (b.o===oid){ items[b.n]=(items[b.n]||0)+(b.qty||1); total += (b.price||0)*(b.qty||1); }
  return {items,total};
}
function roundTotal(rid){ let t=S.rounds[rid]?.carryTotal||0; for (const b of Object.values(S.bookings)) if (b.r===rid) t+=(b.price||0)*(b.qty||1); return t; }

function target(key){
  if (!key) return null; const i=key.indexOf(":"); const t=key.slice(0,i), id=key.slice(i+1);
  if (t==="m" && S.members[id]) return {t,id,key,label:S.members[id].name};
  if (t==="o" && S.ops[id]) { const o=S.ops[id]; return {t,id,key,label:o.title,o}; }
  if (t==="r" && S.rounds[id]) { const r=S.rounds[id]; return {t,id,key,label:`Runde von ${mName(r.payer)}`,r}; }
  return null;
}
const cartOf = key => UI.carts[key]?.items || {};
function setCart(key, items){ if (Object.keys(items).length) UI.carts[key]={items,ts:Date.now()}; else delete UI.carts[key]; saveCarts(); }

// Monatsstatistik: abgeschlossene Monate (stats) + laufende Buchungen
function monthAgg(){
  const out={};
  for (const [ym,doc] of Object.entries(S.stats)){ out[ym]={}; for (const [pid,v] of Object.entries(doc.items||{})) out[ym][pid]={...v}; }
  for (const b of Object.values(S.bookings)){ if (!isProd(b)) continue;
    const ym=ymOf(b.ts||Date.now()); const p=S.products[b.p]||{}; const o=(out[ym]=out[ym]||{});
    const e=(o[b.p]=o[b.p]||{n:b.n,q:0,c:0,l:0,cat:p.cat||""});
    e.q+=b.qty||1; e.c+=(b.price||0)*(b.qty||1); e.l+=((p.ml||0)*(b.qty||1))/1000; if(!e.cat) e.cat=p.cat||""; }
  return out;
}

async function sha(s){
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("kantine:"+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of "kantine:"+s) h=((h<<5)+h+c.charCodeAt(0))|0; return "d"+(h>>>0).toString(16); }
}

// ================= Writes =================
function errText(e){
  const c = e && e.code;
  if (c==="invalid_argument") return "Dieser Eintrag existiert nicht mehr – die Ansicht wird aktualisiert.";
  if (c==="quota_exceeded") return "Speicher voll. Bitte unter Verwaltung einen Abschluss machen, damit alte Buchungen zusammengefasst werden.";
  if (c==="resource_exhausted") return "Zu viele Aktionen auf einmal. Kurz warten und erneut versuchen.";
  return "Speichern fehlgeschlagen. Bitte Verbindung prüfen und erneut versuchen.";
}
async function w(fn, okMsg){
  if (!S.db){ toast("Keine Verbindung zur Datenbank."); return false; }
  try { await fn(S.db); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await fn(S.db); if(okMsg) toast(okMsg); return true; }catch(e2){ e=e2; } }
    if (e && e.code==="invalid_argument" && S.canWrite==null){ S.readOnly=true; render(); }
    toast(errText(e)); console.error(e); return false;
  }
}
const clean = o => { const r={}; for (const [k,v] of Object.entries(o)) if (v!==undefined) r[k]=v; return r; };

async function uploadReceipt(file){
  if (!file) return null;
  if (!S.assets) throw {code:"no_assets"};
  let blob=file;
  if (file.type.startsWith("image/") && file.type!=="image/svg+xml"){
    try{ const bmp=await createImageBitmap(file); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
      const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
      cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
      blob = await new Promise(r=>cv.toBlob(r,"image/jpeg",.82)) || file; }catch(e){ blob=file; }
  }
  const res = await S.assets.upload(blob);
  return res.id;
}

// ================= Toast & Modal =================
let toastTimer=null;
function toast(msg, action){
  clearTimeout(toastTimer);
  const root=$("#toastRoot");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action?`<button type="button" id="toastAct">${esc(action.label)}</button>`:""}</div>`;
  if (action) $("#toastAct").onclick = () => { root.innerHTML=""; action.fn(); };
  toastTimer=setTimeout(()=>{ root.innerHTML=""; }, action?9000:3800);
}
function modal(html, onMount, wide){
  const root=$("#modalRoot");
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("click", e => { if (e.target.id==="ov") closeModal(); });
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  const first = root.querySelector("input:not([type=checkbox]):not([type=file]),select,textarea"); if(first) setTimeout(()=>first.focus(),30);
  if (onMount) onMount(root);
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
document.addEventListener("keydown", e => { if (e.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); });
function confirmBox(title, text, btn, fn, danger){
  modal(`<h3>${esc(title)}</h3><p style="margin:0">${text}</p><div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn ${danger?"danger":"primary"}" id="cOk">${esc(btn)}</button></div>`,
    r => { r.querySelector("#cOk").onclick = async ()=>{ r.querySelector("#cOk").disabled=true; await fn(); closeModal(); }; });
}
async function copyText(text, title){
  try{ await navigator.clipboard.writeText(text); toast("Kopiert – jetzt z. B. in WhatsApp einfügen"); return; }catch(e){}
  modal(`<h3>${esc(title||"Text kopieren")}</h3><p class="muted" style="margin:0">Text markieren und kopieren:</p><textarea id="cpTxt" rows="10" readonly>${esc(text)}</textarea><div class="actions"><button class="btn primary" data-close>Fertig</button></div>`,
    r=>{ const t=r.querySelector("#cpTxt"); t.focus(); t.select(); });
}

// ================= Render =================
const canWrite = () => !S.readOnly && S.canWrite !== false && !!S.db;
const isAdmin = () => S.canEdit && !S.readOnly;
function adminOpen(){
  if (!isAdmin()) return false;
  if (!S.settings.pinHash) return true;
  if (UI.unlocked && Date.now()-UI.unlockAt < 15*60*1000) return true;
  UI.unlocked=false; return false;
}

function render(){
  document.querySelectorAll("#tabs a").forEach(a => {
    a.setAttribute("aria-current", a.dataset.v===UI.view ? "page" : "false");
    if (a.dataset.v==="verwaltung") a.hidden = !S.canEdit;
  });
  $("#unitName").textContent = S.settings.unit || WEHR;
  const main = $("#main");
  const keep = {}; main.querySelectorAll("input[id],select[id],textarea[id]").forEach(el => { if (el.type!=="file") keep[el.id] = el.type==="checkbox"?el.checked:el.value; });
  const act = document.activeElement && main.contains(document.activeElement) ? document.activeElement.id : null;
  let sel=null; try{ if (act) sel=[document.activeElement.selectionStart, document.activeElement.selectionEnd]; }catch(e){}
  let html;
  if (MODE!=="staff") return;
  if (S.settings.teamPinHash && UI.tlocked){
    main.innerHTML=`<div class="stack" style="max-width:360px;margin:0 auto;text-align:center"><h2>Kantine gesperrt</h2><p class="muted" style="margin:0">Team-PIN oder Admin-PIN eingeben.</p>
    <div class="pindots" id="tpinDots">${[0,1,2,3,4,5].map(()=>"<i></i>").join("")}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="tpin" data-k="${n}">${n}</button>`).join("")}<button data-act="tpin" data-k="c" aria-label="Löschen">⌫</button><button data-act="tpin" data-k="0">0</button><button data-act="tpin" data-k="ok" style="background:var(--red);color:var(--red-ink);border-color:var(--red)">OK</button></div></div>`;
    return;
  }
  if (!S.db && S.failed) html = `<div class="empty"><b>Die Daten konnten nicht geladen werden.</b><span>Bitte Internetverbindung prüfen und die Seite neu laden.</span></div>`;
  else if (S.loaded.size < COLS.length+1) html = `<div class="empty"><b>Kantine wird geladen …</b><span>${S.offline?"Die Daten sind gerade nicht erreichbar. Die Ansicht aktualisiert sich, sobald die Verbindung steht.":"Mitglieder, Artikel und Buchungen kommen gleich."}</span></div>`;
  else html = ({kiosk:vKiosk, konto:vKonto, termine:vTermine, lager:vLager, statistik:vStats, verwaltung:vAdmin}[UI.view] || vKiosk)();
  main.innerHTML = html;
  for (const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if (el && main.contains(el) && !el.dataset.fresh){ if (el.type==="checkbox") el.checked=v; else el.value=v; } }
  if (act){ const el=document.getElementById(act); if (el){ el.focus(); try{ if(sel && sel[0]!=null) el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
  wakeCheck();
}
const roNote = () => canWrite() ? "" : `<div class="note">Nur Ansicht: Dein Zugang ist zum Lesen freigeschaltet. Buchen kann der Kassenwart.</div>`;

// ---------- Strichliste ----------
function vKiosk(){
  const ms = membersActive(); const ps = productsActive();
  if (!ms.length || !ps.length){
    return `<div class="stack"><h2>Strichliste</h2>
      <div class="empty"><b>${!ms.length?"Noch keine Mitglieder angelegt.":"Noch keine Artikel angelegt."}</b>
      <span>Der Kassenwart legt unter <i>Verwaltung → Stammdaten</i> zuerst Mitglieder und das Sortiment mit Preisen an. Danach bucht der Kassenwart bei der Ausgabe mit zwei Fingertipps an.</span>
      ${S.canEdit?`<button class="btn primary" data-act="goadmin" data-tab="stamm">Zu den Stammdaten</button>`:""}</div></div>`;
  }
  const t = target(UI.sel);
  if (t) return vKioskProducts(t, ps);
  UI.sel=null;
  const q = UI.search.trim().toLowerCase();
  const shown = ms.filter(m => !q || m.name.toLowerCase().includes(q));
  const ops = list("ops").filter(o=>o.open).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const rounds = list("rounds").filter(r=>r.open && S.members[r.payer]).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const pend = Object.entries(UI.carts).map(([k,c])=>({k,c,t:target(k)})).filter(x=>x.t);
  const recent = list("bookings").filter(b => Date.now()-(b.ts||0) < 15*60*1000 && isProd(b)).sort((a,b)=>b.ts-a.ts).slice(0,8);
  const cnt = items => Object.values(items).reduce((s,q)=>s+q,0);
  return `<div class="stack">
    ${pend.length?`<div class="pending"><b>Angefangene Buchungen – noch nicht gebucht</b>
      ${pend.map(x=>`<div class="row between"><span><b style="color:inherit">${esc(x.t.label)}</b> · ${cnt(x.c.items)} Artikel · seit ${new Date(x.c.ts).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span><span class="row"><button class="btn small primary" data-act="pick" data-key="${esc(x.k)}">Weiter buchen</button><button class="btn small ghost" data-act="dropcart" data-key="${esc(x.k)}">Verwerfen</button></span></div>`).join("")}</div>`:""}
    ${roNote()}
    <div class="section"><div class="eyebrow">Auf die Wehr oder eine Runde buchen</div>
      <div class="special">
        ${ops.map(o=>{const tt=opTotals(o.id).total;return `<button class="tile op" data-act="pick" data-key="o:${o.id}"><span class="tag">${esc(o.kind||"Einsatz")} · ${dDate(o.date).slice(0,6)}</span>${esc(o.title)}<span class="sub">Verpflegung bisher ${eur(tt)}</span>${UI.carts["o:"+o.id]?`<span class="pend">offen</span>`:""}</button>`}).join("")}
        ${rounds.map(r=>`<button class="tile round" data-act="pick" data-key="r:${r.id}"><span class="tag">Runde${r.reason?` · ${esc(r.reason)}`:""}</span>${esc(mName(r.payer))} gibt aus<span class="sub">bisher ${eur(roundTotal(r.id))}</span>${UI.carts["r:"+r.id]?`<span class="pend">offen</span>`:""}</button>`).join("")}
        ${canWrite()?`<button class="tile addtile" data-act="opnew">+ Einsatz oder Übung verpflegen</button><button class="tile addtile" data-act="roundnew">+ Runde ausgeben</button>`:""}

  });

// ---------- Statistik ----------
function vStats(){
  const agg = monthAgg();
  const now=new Date(); const months=[];
  for (let i=11;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 15); months.push(isoLocal(d).slice(0,7)); }
  const allP = {}; for (const ym in agg) for (const [pid,v] of Object.entries(agg[ym])) allP[pid]=S.products[pid]?.name||v.n;
  const pid = UI.statProd && allP[UI.statProd] ? UI.statProd : "";
  const meas = UI.statMeasure;
  const val = ym => { const o=agg[ym]||{}; let s=0; for (const [k,v] of Object.entries(o)) if (!pid||k===pid) s += meas==="c"?v.c:v.q; return s; };
  const vals = months.map(val);
  const sel = months.includes(UI.statMonth) ? UI.statMonth : months[months.length-1];
  const max = Math.max(...vals,0);
  const nice = (()=>{ if (!max) return meas==="c"?1000:10; const m=meas==="c"?max/100:max; const p=Math.pow(10,Math.floor(Math.log10(m))); const n=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=m); return meas==="c"?n*100:n; })();
  const lab = v => meas==="c"? eur(v).replace(",00","") : nf.format(v);
  const top = Object.entries(agg[sel]||{}).map(([k,v])=>({k,...v,n:S.products[k]?.name||v.n})).sort((a,b)=>b.q-a.q);
  const hasData = Object.keys(agg).length>0;
  // Year review
  const years=new Set([new Date().getFullYear()]); Object.keys(agg).forEach(ym=>years.add(+ym.slice(0,4))); list("ops").forEach(o=>o.date&&years.add(+o.date.slice(0,4)));
  const Y = years.has(UI.year)?UI.year:new Date().getFullYear();
  const yItems={}; let yRev=0, yQ=0, yL=0;
  for (const [ym,o] of Object.entries(agg)) if (+ym.slice(0,4)===Y) for (const [k,v] of Object.entries(o)){ const e=(yItems[k]=yItems[k]||{n:S.products[k]?.name||v.n,q:0,cat:v.cat||S.products[k]?.cat||""}); e.q+=v.q; yRev+=v.c; yQ+=v.q; yL+=v.l||0; }
  const yArr=Object.values(yItems).sort((a,b)=>b.q-a.q);
  const catQ = c => yArr.filter(x=>x.cat===c).reduce((s,x)=>s+x.q,0);
  const yOps=list("ops").filter(o=>o.date && +o.date.slice(0,4)===Y);
  const yEv=list("events").filter(e=>+e.date.slice(0,4)===Y);
  const yPers=list("signups").filter(s=>yEv.some(e=>e.id===s.e)).reduce((s,x)=>s+(x.count||1),0);
  const yRounds=list("rounds").filter(r=>new Date(r.ts||0).getFullYear()===Y).length;

function aKonten(){
  let rows = membersActive().map(m=>({...m, bal:balance(m.id), last:lastActivity(m.id)}));
  const sumPos = rows.filter(r=>r.bal>0).reduce((s,r)=>s+r.bal,0), sumNeg = rows.filter(r=>r.bal<0).reduce((s,r)=>s+r.bal,0);
  if (UI.debtOnly) rows = rows.filter(r=>r.bal<0);
  rows.sort((a,b)=>a.bal-b.bal);
  return `<div class="kpis"><div class="kpi"><span class="eyebrow">Offen zur Verrechnung</span><b class="num neg">${eur(-sumNeg)}</b><span class="hint">Abzug bei der nächsten Aufwandsentschädigung</span></div>
      <div class="kpi"><span class="eyebrow">Guthaben gesamt</span><b class="num pos">${eur(sumPos)}</b></div>
      <div class="kpi"><span class="eyebrow">Kassenstand</span><b class="num">${eur(cashBalance())}</b><span class="hint">laut Kassenbuch</span></div></div>
    <section class="section"><div class="row between"><h3>Konten</h3><div class="row">
      <label class="row" style="gap:6px;font-weight:600"><input type="checkbox" id="debtOnly" ${UI.debtOnly?"checked":""}> Nur offene</label>
      <button class="btn" data-act="pay">Einzahlung erfassen</button><button class="btn" data-act="csv">Kontenliste exportieren</button></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Name</th><th class="r">Kontostand</th><th>Letzte Buchung</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="r num"><b class="${r.bal<0?"neg":r.bal>0?"pos":""}">${eur(r.bal)}</b></td><td class="muted">${r.last?tsStr(r.last):"–"}</td><td class="r"><button class="btn small" data-act="pay" data-id="${r.id}">${r.bal<0?"Ausgleichen":"Einzahlung"}</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">${UI.debtOnly?"Niemand hat offene Beträge.":"Noch keine Mitglieder."}</td></tr>`}
      </tbody></table></div></section>`;
}
function aOps(){
  const all = list("ops"); const years=new Set([new Date().getFullYear()]); all.forEach(o=>o.date&&years.add(+o.date.slice(0,4)));
  const Y = years.has(UI.opYear)?UI.opYear:new Date().getFullYear();
  const ops = all.filter(o=>o.date && +o.date.slice(0,4)===Y).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  const tot = ops.map(o=>({o,...opTotals(o.id)}));
  const open = tot.filter(x=>!x.o.settled).reduce((s,x)=>s+x.total,0), sum = tot.reduce((s,x)=>s+x.total,0);
  return `<div class="kpis"><div class="kpi"><span class="eyebrow">Noch nicht mit Gemeinde abgerechnet</span><b class="num">${eur(open)}</b></div>
      <div class="kpi"><span class="eyebrow">Verpflegung ${Y} gesamt</span><b class="num">${eur(sum)}</b></div>
      <div class="kpi"><span class="eyebrow">Einsätze / Übungen</span><b class="num">${ops.filter(o=>o.kind==="Einsatz").length} / ${ops.filter(o=>o.kind!=="Einsatz").length}</b></div></div>
    <div class="row between"><label class="f" style="width:140px">Jahr<select id="opYear">${[...years].sort((a,b)=>b-a).map(y=>`<option ${y===Y?"selected":""}>${y}</option>`).join("")}</select></label>
      <div class="row" style="align-self:flex-end"><button class="btn" data-act="opcsv" data-y="${Y}">Abrechnung ${Y} exportieren</button><button class="btn primary" data-act="opnew">Einsatz anlegen</button></div></div>
    ${tot.length?tot.map(({o,items,total})=>`<div class="panel section"><div class="row between"><div><span class="pill op">${esc(o.kind||"Einsatz")}</span> <span class="muted">${dDate(o.date)}</span><h3 style="margin-top:4px">${esc(o.title)}</h3></div>
      <div class="row"><b class="num" style="font-size:1.3rem">${eur(total)}</b>${o.open?`<span class="pill warn">Läuft</span>`:o.settled?`<span class="pill ok">Abgerechnet</span>`:`<span class="pill neutral">Offen ggü. Gemeinde</span>`}</div></div>
      ${Object.keys(items).length?`<div class="chips">${Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<span class="chip">${q}× ${esc(n)}</span>`).join("")}</div>`:`<p class="muted" style="margin:0">Noch nichts gebucht.</p>`}
      <div class="row">${o.open?`<button class="btn small" data-act="opend" data-id="${o.id}">Verpflegung beenden</button>`:`<button class="btn small" data-act="opsettle" data-id="${o.id}">${o.settled?"Abrechnung zurücknehmen":"Mit Gemeinde abgerechnet"}</button><button class="btn small ghost" data-act="opreopen" data-id="${o.id}">Wieder öffnen</button>`}
        <button class="btn small ghost" data-act="opedit" data-id="${o.id}">Bearbeiten</button></div></div>`).join("")
    :`<div class="empty"><b>Keine Einsatzverpflegung in ${Y}.</b><span>Nach einem Einsatz oder einer Übung tippt jemand an der Strichliste auf „Einsatz oder Übung verpflegen“. Alles, was dann gebucht wird, geht auf die Wehr statt auf das Mitglied und landet hier für die Abrechnung mit der Gemeinde.</span></div>`}`;
}
// ---------- Aufwandsentschädigung (Abzugsliste für die Kassiererin) ----------
function aeDefaultLabel(){ const d=new Date(); return `${Math.floor(d.getMonth()/3)+1}. Quartal ${d.getFullYear()}`; }
function aAE(){
  const debt = membersActive().map(m=>({m,bal:balance(m.id)})).filter(x=>x.bal<0);
  const sumDebt = -debt.reduce((s,x)=>s+x.bal,0);
  const sets = list("settlements").sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0));
  const last = sets[0];
  return `<div class="panel stack"><p style="margin:0">Die Kassiererin zahlt die Aufwandsentschädigung quartalsweise bar aus und zieht dabei ab, was in der Kantine angeschrieben wurde. Die Kantine kennt die Höhe der Aufwandsentschädigung nicht: Sie gibt der Kassiererin nur die Abzugsliste – wer wie viel für die Kantine abgezogen bekommt. Nach der Auszahlung buchst du die Liste hier, und die Konten stehen wieder auf null.</p>
      <div class="kpis"><div class="kpi"><span class="eyebrow">Offen für die Abzugsliste</span><b class="num neg">${eur(sumDebt)}</b><span class="hint">${debt.length} ${debt.length===1?"Kamerad":"Kameraden"}</span></div>
        <div class="kpi"><span class="eyebrow">Letzte Abzugsliste</span><b class="num">${last?eur(last.total||0):"–"}</b><span class="hint">${last?`${esc(last.label)} · ${dDate(last.date)}`:"noch keine"}</span></div></div>
      <div class="row"><button class="btn primary" data-act="aeprep" ${debt.length?"":"disabled"}>Abzugsliste erstellen</button></div></div>
    <section class="section"><h3>Bisherige Abzugslisten</h3>
      ${sets.length?`<div class="tbl-wrap"><table><thead><tr><th>Quartal</th><th>Stichtag</th><th class="r">Kameraden</th><th class="r">Abgezogen</th><th></th></tr></thead><tbody>
      ${sets.map(s=>`<tr><td><b>${esc(s.label)}</b></td><td class="num">${dDate(s.date)}</td><td class="r num">${(s.rows||[]).filter(r=>r.deduct>0).length}</td><td class="r num">${eur(s.total||0)}</td><td class="r"><button class="btn small" data-act="aeshow" data-id="${s.id}">Ansehen</button></td></tr>`).join("")}
      </tbody></table></div>`:`<div class="empty"><b>Noch keine Abzugsliste.</b><span>Vor der nächsten Auszahlung erstellst du hier die Liste für die Kassiererin.</span></div>`}</section>`;
}
function aeText(label, rows){
  const r=rows.filter(x=>x.deduct>0);
  return [`Kantine${S.settings.unit?` ${S.settings.unit}`:""} – Abzug von der Aufwandsentschädigung, ${label}`,"",
    ...r.map(x=>`${x.name}: ${eur(x.deduct)}`),"",`Summe: ${eur(r.reduce((s,x)=>s+x.deduct,0))} (${r.length} Kameraden)`].join("\n");
}
const aeCsv = rows => csv(["Name","Abzug Kantine EUR"], rows.filter(x=>x.deduct>0).map(x=>[x.name, centsIn(x.deduct)]));
function aeTable(rows, editable){
  return `<div class="tbl-wrap"><table style="min-width:420px"><thead><tr><th>Name</th><th class="r">Angeschrieben</th><th class="r">Abzug Kantine</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td><b>${esc(r.name)}</b>${r.open-r.deduct>0?`<br><span class="small neg">${eur(r.open-r.deduct)} bleibt offen</span>`:""}</td><td class="r num">${eur(r.open)}</td>
      <td class="r">${editable?`<input type="text" inputmode="decimal" data-i="${i}" value="${centsIn(r.deduct)}" aria-label="Abzug ${esc(r.name)}">`:`<b class="num">${eur(r.deduct)}</b>`}</td></tr>`).join("")}
    </tbody><tfoot><tr><td>Summe</td><td class="r num">${eur(rows.reduce((s,r)=>s+r.open,0))}</td><td class="r num">${eur(rows.reduce((s,r)=>s+r.deduct,0))}</td></tr></tfoot></table></div>`;
}
function aePrep(){
  const rows = membersActive().map(m=>({m:m.id, name:m.name, open:Math.max(0,-balance(m.id))})).filter(r=>r.open>0).map(r=>({...r,deduct:r.open}));
  let confirmStep=false;
  modal(`<h3>Abzugsliste für die Kassiererin</h3>
    <p class="muted" style="margin:0">Enthält nur, wer etwas angeschrieben hat, und nur den Abzug für die Kantine. Konnte bei jemandem nicht alles abgezogen werden, trägst du den tatsächlichen Abzug ein – der Rest bleibt auf dem Konto offen.</p>
    <div class="grid2"><label class="f">Quartal<input type="text" id="aeLabel" maxlength="60" value="${esc(aeDefaultLabel())}"></label><label class="f">Stichtag<input type="date" id="aeDate" value="${today()}"></label></div>
    <div id="aeTbl">${aeTable(rows,true)}</div>
    <div class="row"><button class="btn" id="aeCopy">Liste als Text kopieren</button><button class="btn" id="aeExport">Als Datei exportieren</button></div>
    <label class="row" style="font-weight:600"><input type="checkbox" id="aeCash"> Die Kassiererin übergibt die Summe bar an die Kantine – als Einnahme ins Kassenbuch</label>
    <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="aeBook">Nach Auszahlung buchen</button></div>`, r=>{
    const box=r.querySelector("#aeTbl");
    const syncAll=()=>{ box.querySelectorAll("input[data-i]").forEach(el=>{ const x=rows[el.dataset.i]; const v=parseEur(el.value); x.deduct = isNaN(v)?x.deduct:Math.min(x.open,Math.max(0,v)); }); box.innerHTML=aeTable(rows,true); };
    box.addEventListener("change", syncAll);
    const label=()=>r.querySelector("#aeLabel").value.trim()||aeDefaultLabel();
    r.querySelector("#aeCopy").onclick=()=>{ syncAll(); copyText(aeText(label(),rows),"Abzugsliste kopieren"); };
    r.querySelector("#aeExport").onclick=()=>{ syncAll(); saveFile(`Kantine-Abzug-${label()}.csv`, aeCsv(rows)); };
    r.querySelector("#aeBook").onclick=async()=>{
      const btn=r.querySelector("#aeBook");
      if (!confirmStep){ syncAll(); }
      const total=rows.reduce((s,x)=>s+x.deduct,0); const n=rows.filter(x=>x.deduct>0).length;
      if (!total){ toast("Die Liste enthält keinen Abzug."); return; }
      if (!confirmStep){ confirmStep=true; btn.textContent=`${eur(total)} bei ${n} Kameraden als verrechnet buchen – bestätigen`; btn.classList.add("danger"); btn.classList.remove("primary"); return; }
      btn.disabled=true;
      const lb=label(), date=r.querySelector("#aeDate").value||today(), cash=r.querySelector("#aeCash").checked;
      const ok=await w(async db=>{ const now=Date.now();
        for (const x of rows) if (x.deduct>0) await db.collection("payments").doc().set({m:x.m, amount:x.deduct, note:`Abzug Aufwandsentschädigung ${lb}`, ts:now});
        await db.collection("settlements").doc().set({label:lb, date, ts:now, total, rows:rows.filter(x=>x.deduct>0).map(x=>({m:x.m,name:x.name,open:x.open,deduct:x.deduct}))});
        if (cash) await db.collection("cash").doc().set({date, type:"in", amount:total, text:`Übergabe Kassiererin, Abzug Aufwandsentschädigung ${lb}`, cat:"Einzahlung Mitglied", receipt:"", ts:now});
      }, `${eur(total)} als verrechnet gebucht`);
      if (ok) closeModal(); else btn.disabled=false;
    };
  }, true);
}
function aeShow(id){
  const s=S.settlements[id]; if(!s) return;
  const rows=s.rows||[];
  modal(`<h3>Abzugsliste ${esc(s.label)}</h3><p class="muted" style="margin:0">Stichtag ${dDate(s.date)} · ${eur(s.total||0)}</p>${aeTable(rows,false)}

    r.querySelector("#aeX").onclick=()=>saveFile(`Kantine-Abzug-${s.label}.csv`, aeCsv(rows));
  }, true);
}

function cashSorted(){ return list("cash").sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.ts||0)-(b.ts||0)); }
function cashBalance(){ return (S.settings.cashStart||0) + cashSorted().reduce((s,c)=>s+(c.type==="out"?-c.amount:c.amount),0); }
function aKasse(){
  const all=cashSorted(); const years=new Set([new Date().getFullYear()]); all.forEach(c=>c.date&&years.add(+c.date.slice(0,4)));
  const Y = years.has(UI.cashYear)?UI.cashYear:new Date().getFullYear();
  let run=S.settings.cashStart||0; const rows=[];
  for (const c of all){ run += c.type==="out"?-c.amount:c.amount; if (+String(c.date).slice(0,4)===Y) rows.push({...c,run}); }
  const yin=rows.filter(r=>r.type!=="out").reduce((s,r)=>s+r.amount,0), yout=rows.filter(r=>r.type==="out").reduce((s,r)=>s+r.amount,0);
  const startY = rows.length ? rows[0].run - (rows[0].type==="out"?-rows[0].amount:rows[0].amount) : null;
  const missing = rows.filter(r=>r.type==="out" && !r.receipt).length;
  return `<div class="kpis"><div class="kpi"><span class="eyebrow">Kassenstand jetzt</span><b class="num">${eur(cashBalance())}</b></div>
      <div class="kpi"><span class="eyebrow">Einnahmen ${Y}</span><b class="num pos">${eur(yin)}</b></div>
      <div class="kpi"><span class="eyebrow">Ausgaben ${Y}</span><b class="num neg">${eur(yout)}</b></div>
      <div class="kpi"><span class="eyebrow">Ausgaben ohne Beleg</span><b class="num ${missing?"neg":""}">${missing}</b><span class="hint">für die Kassenprüfung nachreichen</span></div></div>
    <div class="row between"><label class="f" style="width:140px">Jahr<select id="cashYear">${[...years].sort((a,b)=>b-a).map(y=>`<option ${y===Y?"selected":""}>${y}</option>`).join("")}</select></label>
      <div class="row" style="align-self:flex-end"><button class="btn" data-act="cashstart">Anfangsbestand</button><button class="btn" data-act="cashcsv" data-y="${Y}">Kassenbuch ${Y} exportieren</button><button class="btn primary" data-act="cashnew">Eintrag erfassen</button></div></div>

let pinBuf="", tpinBuf="";
async function bookCart(){
  const t=target(UI.sel); if(!t) return;
  const cart=cartOf(t.key);
  const lines = Object.entries(cart).filter(([pid,q])=>q>0 && S.products[pid]);
  if (!lines.length) return;
  const ts=Date.now(); const ids=[];
  const base = {...(t.t==="m"?{m:t.id} : t.t==="o"?{o:t.id} : {m:t.r.payer, r:t.id}), by:S.email||""};
  const ok = await w(async db=>{
    for (const [pid,q] of lines){ const p=S.products[pid]; const ref=db.collection("bookings").doc(); ids.push(ref.id);
      await ref.set({...base,p:pid,n:p.name,price:p.price,qty:q,ts}); }
  });
  if (!ok) return;
  const total = lines.reduce((s,[pid,q])=>s+S.products[pid].price*q,0);
  const who = t.t==="m"?t.label : t.t==="o"?t.label : `die Runde von ${mName(t.r.payer)}`;
  setCart(t.key,{});
  if (t.t==="m"){ UI.sel=null; UI.search=""; }
  render(); window.scrollTo({top:0});
  toast(`${lines.map(([pid,q])=>`${q}× ${S.products[pid].name}`).join(", ")} für ${who} gebucht · ${eur(total)}`, {label:"Rückgängig", fn: async()=>{
    await w(async db=>{ for (const id of ids) await db.doc("bookings/"+id).delete(); }, "Buchung zurückgenommen");
  }});
}

async function saveFile(name, text, type){
  try{
    const blob = type ? new Blob([text],{type}) : new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name.replace(/[\\/:*?"<>|]/g,"-");
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }catch(e){ copyText(text, "Export – in Excel einfügen"); }
}
const csvCell = v => { v=String(v??""); return /[;"\n]/.test(v)? `"${v.replace(/"/g,'""')}"` : v; };
const csv = (head, rows) => [head.join(";"), ...rows.map(r=>r.map(csvCell).join(";"))].join("\n");

function runClose(){
  const nB=Object.keys(S.bookings).length, nP=Object.keys(S.payments).length;
  confirmBox("Abschluss durchführen", `${nB} Buchungen und ${nP} Einzahlungen werden zusammengefasst und dann gelöscht. Kontostände, Bestände, Leergut, Einsatzverpflegung und Statistik bleiben gleich. Das lässt sich nicht rückgängig machen – vorher „Alle Buchungen exportieren“.`, "Abschluss durchführen", async()=>{
    const now=Date.now();
    const bk=list("bookings"), py=list("payments");
    // 1. alles vorher berechnen
    const agg=monthAgg(); const statsW={};
    const touched=new Set(bk.filter(isProd).map(b=>ymOf(b.ts||now)));
    for (const ym of touched) statsW[ym]={month:ym, items:agg[ym]||{}};
    const prodW=list("products").map(p=>[p.id, clean({base:p.track!==false?stock(p.id):p.base, baseAt:now, emptyBase:p.pfand?empties(p.id):undefined, emptyAt:p.pfand?now:undefined})]);
    const memW=list("members").map(m=>[m.id, balance(m.id)]);
    const opW=[...new Set(bk.filter(b=>b.o).map(b=>b.o))].filter(id=>S.ops[id]).map(id=>[id, opTotals(id)]);
    const rW=[...new Set(bk.filter(b=>b.r).map(b=>b.r))].filter(id=>S.rounds[id]).map(id=>[id, roundTotal(id)]);
    await w(async db=>{
      for (const [ym,d] of Object.entries(statsW)) await db.doc("stats/"+ym).set(d);
      for (const [id,d] of prodW) await db.doc("products/"+id).update(d);
      for (const [id,c] of memW) await db.doc("members/"+id).update({carry:c, closedAt:now});
      for (const [id,t] of opW) await db.doc("ops/"+id).update({carry:t});
      for (const [id,t] of rW) await db.doc("rounds/"+id).update({carryTotal:t});
      for (const b of bk) await db.doc("bookings/"+b.id).delete();
      for (const p of py) await db.doc("payments/"+p.id).delete();
    }, "Abschluss erledigt");
  }, true);
}

// ---------- Event wiring ----------
document.addEventListener("click", async ev => {
  UI.lastAct=Date.now();
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if (t.type==="checkbox" && a!=="shopdone") return;
  switch(a){
    case "pick": UI.sel=t.dataset.key; render(); window.scrollTo({top:0}); break;
    case "unpick": case "alarm": UI.sel=null; render(); window.scrollTo({top:0}); if (a==="alarm") toast("Gemerkt. Die Buchung wartet oben unter „Angefangene Buchungen“."); break;
    case "dropcart": setCart(t.dataset.key,{}); render(); break;
    case "add": { if (ev.target.closest(".minus")) return; const c={...cartOf(UI.sel)}; c[id]=(c[id]||0)+1; setCart(UI.sel,c); render(); break; }
    case "sub": { ev.stopPropagation(); const c={...cartOf(UI.sel)}; c[id]=Math.max(0,(c[id]||0)-1); if(!c[id]) delete c[id]; setCart(UI.sel,c); render(); break; }
    case "clear": setCart(UI.sel,{}); render(); break;
    case "book": t.disabled=true; await bookCart(); break;
    case "storno": { const b=S.bookings[id]; if(!b) return; confirmBox("Buchung stornieren", `${b.qty}× ${esc(b.n)} (${eur(b.price*b.qty)}) wieder austragen?`, "Stornieren", ()=>w(db=>db.doc("bookings/"+id).delete(),"Storniert"), true); break; }
    case "opnew": opForm(); break;
    case "opedit": opForm(id); break;
    case "opend": { const tt=opTotals(id).total; const o=S.ops[id]; confirmBox("Verpflegung beenden", `${esc(o.kind)} „${esc(o.title)}“ mit <b>${eur(tt)}</b> abschließen? Der Kassenwart sieht es danach in der Einsatzverpflegung zur Abrechnung mit der Gemeinde.`, "Beenden", async()=>{ if (await w(db=>db.doc("ops/"+id).update({open:false}),"Verpflegung beendet")){ if (UI.sel==="o:"+id){ setCart(UI.sel,{}); UI.sel=null; } render(); } }); break; }
    case "opsettle": w(db=>db.doc("ops/"+id).update({settled:!S.ops[id].settled}), S.ops[id].settled?"Zurückgenommen":"Als abgerechnet markiert"); break;
    case "opreopen": w(db=>db.doc("ops/"+id).update({open:true, settled:false}),"Wieder geöffnet – jetzt an der Strichliste buchbar"); break;
    case "opcsv": { const Y=+t.dataset.y; const rows=[];
      for (const o of list("ops").filter(o=>o.date&&+o.date.slice(0,4)===Y).sort((a,b)=>a.date.localeCompare(b.date))){
        const its={}; for (const b of Object.values(S.bookings)) if (b.o===o.id){ const e=(its[b.n]=its[b.n]||{q:0,c:0}); e.q+=b.qty||1; e.c+=(b.price||0)*(b.qty||1); }
        for (const [n,q] of Object.entries(o.carry?.items||{})) if (!its[n]) its[n]={q, c:null}; else its[n].q+=q;
        const tot=opTotals(o.id).total;
        for (const [n,e] of Object.entries(its)) rows.push([dDate(o.date), o.kind, o.title, n, e.q, e.c==null?"":centsIn(e.c), ""]);
        rows.push([dDate(o.date), o.kind, o.title, "Summe", "", "", centsIn(tot)]);
        rows.push([o.settled?"abgerechnet":"offen"]);
      }
      saveFile(`Einsatzverpflegung-${Y}.csv`, csv(["Datum","Art","Stichwort","Artikel","Menge","Betrag EUR","Summe EUR"], rows)); break; }
    case "roundnew": roundForm(); break;
    case "roundend": { const r=S.rounds[id]; confirmBox("Runde beenden", `Die Runde von <b>${esc(mName(r.payer))}</b> kostet <b>${eur(roundTotal(id))}</b>. Alles ist bereits auf ihr Konto gebucht. Runde jetzt schließen?`.replace("ihr Konto","das Konto"), "Runde beenden", async()=>{ if (await w(db=>db.doc("rounds/"+id).update({open:false}),"Runde beendet – danke fürs Ausgeben!")){ setCart("r:"+id,{}); UI.sel=null; render(); } }); break; }
    case "signup": signupForm(id); break;
    case "evtoggle": UI.openEvent = UI.openEvent===id?null:id; render(); break;
    case "pasttoggle": UI.showPast=!UI.showPast; render(); break;
    case "evnew": eventForm(); break;
    case "evedit": eventForm(id); break;
    case "evbill": billEvent(id); break;
    case "einkauf": stockForm("buy"); break;

// ================= Speicher: verschlüsselt im privaten GitHub-Repository =================
// Jedes Gerät hält eine vollständige Kopie. Änderungen werden als Operationen gesammelt und
// beim Abgleich auf den neuesten Stand im Repository angewendet (funktioniert auch offline).
const GH = "https://api.github.com";
const OWNER = CFG.owner, APPREPO = CFG.appRepo, DATAREPO = CFG.dataRepo;
const tenc = new TextEncoder(), tdec = new TextDecoder();
let TOKEN = "", DEK = null, HDR = null;           // HDR = {salt, wrap} aus der Datendatei
let REMOTE = {sha:null, state:null}, PENDING = [];
let syncing=false, syncTimer=null, lastSync=0, syncErr="", needWrite=false;
function randId(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
const DEV = (()=>{ let d=ls.get("kantine.dev"); if(!d){ d=randId(6); ls.set("kantine.dev",d); } return d; })();
const ss = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) }catch(e){} } };

// --- Krypto
const b64 = buf => { const a=new Uint8Array(buf); let s=""; for (let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode(...a.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(String(s).replace(/\s/g,"")), c=>c.charCodeAt(0));
async function gz(bytes){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); }
async function gunz(bytes){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()); }
async function seal(key, bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {iv:b64(iv), ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, bytes))}; }
async function unseal(key, o){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, key, unb64(o.ct))); }
async function kek(pw, salt){ const base=await crypto.subtle.importKey("raw", tenc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
const importDek = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt","decrypt"]);
async function newHeader(pw, dekRaw){ const salt=crypto.getRandomValues(new Uint8Array(16)); return {salt:b64(salt), wrap:await seal(await kek(pw, salt), dekRaw)}; }
async function encState(state){ return JSON.stringify({app:"kantine", v:2, salt:HDR.salt, wrap:HDR.wrap, ...(await seal(DEK, await gz(tenc.encode(JSON.stringify(state)))))}); }
async function decState(text){ const f=JSON.parse(text); HDR={salt:f.salt, wrap:f.wrap}; return JSON.parse(tdec.decode(await gunz(await unseal(DEK, f)))); }

// --- GitHub API
async function gh(path, opt={}){
  const r=await fetch(GH+path, {...opt, cache:"no-store", headers:{Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", Authorization:"Bearer "+TOKEN, ...(opt.body?{"Content-Type":"application/json"}:{}), ...(opt.headers||{})}});
  if (r.status===204) return null;
  const j=await r.json().catch(()=>null);
  if (!r.ok){ const e=new Error((j&&j.message)||r.statusText); e.status=r.status; throw e; }
  return j;
}
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
async function ghRead(repo, path){
  try{
    const j=await gh(`/repos/${OWNER}/${repo}/contents/${encPath(path)}`);
    if (j.content && j.encoding==="base64") return {sha:j.sha, bytes:unb64(j.content)};
    const raw=await fetch(GH+`/repos/${OWNER}/${repo}/contents/${encPath(path)}`, {cache:"no-store", headers:{Accept:"application/vnd.github.raw", Authorization:"Bearer "+TOKEN}});
    if (!raw.ok){ const e=new Error(raw.statusText); e.status=raw.status; throw e; }
    return {sha:j.sha, bytes:new Uint8Array(await raw.arrayBuffer())};
  }catch(e){ if (e.status===404) return null; throw e; }
}
const ghWrite = (repo, path, bytes, sha, message) => gh(`/repos/${OWNER}/${repo}/contents/${encPath(path)}`, {method:"PUT", body:JSON.stringify({message, content:b64(bytes), ...(sha?{sha}:{})})});

// --- Zustand & Operationen
function emptyState(){ const st={settings:{}, codes:{}}; COLS.forEach(c=>st[c]={}); return st; }
const clone = o => JSON.parse(JSON.stringify(o));
function applyOp(st, op){
  if (op.col==="settings"){ if (op.id==="app"){ if (op.t==="set") st.settings={...op.data}; else if (op.t==="patch") st.settings={...(st.settings||{}),...op.data}; } return; }
  const c = st[op.col] || (st[op.col]={});
  if (op.t==="set") c[op.id]=op.data;
  else if (op.t==="patch"){ if (c[op.id]) c[op.id]={...c[op.id], ...op.data}; }
  else if (op.t==="del") delete c[op.id];
}
function rebuild(){
  const st = clone(REMOTE.state || emptyState()); PENDING.forEach(o=>applyOp(st,o));
  COLS.forEach(c=>{ S[c]=st[c]||{}; S.loaded.add(c); }); S.settings=st.settings||{}; S.loaded.add("settings");
  S.codes = Object.fromEntries(Object.entries(st.codes||{}).map(([k,v])=>[k, v.code]));
}
let persistBusy=false, persistAgain=false;
async function persist(){
  if (!DEK) return; if (persistBusy){ persistAgain=true; return; } persistBusy=true;
  try{ ls.set("kantine.cache", JSON.stringify({hdr:HDR, ...(await seal(DEK, await gz(tenc.encode(JSON.stringify({remote:REMOTE, pending:PENDING})))))})); }catch(e){}
  persistBusy=false; if (persistAgain){ persistAgain=false; persist(); }
}
async function loadCache(){
  try{ const o=JSON.parse(ls.get("kantine.cache")||"null"); if (!o) return false; const d=JSON.parse(tdec.decode(await gunz(await unseal(DEK,o))));
    REMOTE=d.remote||REMOTE; PENDING=d.pending||[]; if (o.hdr) HDR=o.hdr; return true; }catch(e){ return false; }
}
function pushOp(op){ PENDING.push({...op, ts:Date.now(), dev:DEV}); rebuild(); persist(); schedule(); updSync(); scheduleSync(); }
const api = {
  async set(col,id,data){ pushOp({t:"set",col,id,data:clone(data)}); },
  async patch(col,id,p){ const ok = col==="settings" || (S[col]||{})[id]; if (!ok) throw {code:"invalid_argument", message:"Eintrag nicht gefunden"}; pushOp({t:"patch",col,id,data:clone(p)}); },
  async del(col,id){ pushOp({t:"del",col,id}); }
};
function dbRef(col,id){ return { id, set:d=>api.set(col,id,d), update:d=>api.patch(col,id,d), delete:()=>api.del(col,id) }; }
const DB = {
  collection(c){ return { doc(id){ return dbRef(c, id || randId(12)); } }; },
  doc(path){ const i=path.indexOf("/"); return dbRef(path.slice(0,i), path.slice(i+1)); }
};

// --- Abgleich
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, ms==null?6000:ms); }
async function syncNow(){
  if (!TOKEN || !DEK) return;
  if (syncing){ scheduleSync(3000); return; }
  syncing=true; updSync();
  try{
    for (let attempt=0; ; attempt++){
      const cur = await ghRead(DATAREPO, "data.enc");
      let base;
      if (!cur) base = REMOTE.state || emptyState();
      else if (cur.sha===REMOTE.sha && REMOTE.state) base = REMOTE.state;
      else base = await decState(tdec.decode(cur.bytes));
      if (!PENDING.length && !needWrite && cur){ REMOTE={sha:cur.sha, state:base}; break; }
      const sent=PENDING.length; const st=clone(base); PENDING.slice(0,sent).forEach(o=>applyOp(st,o));
      try{
        const res = await ghWrite(DATAREPO, "data.enc", tenc.encode(await encState(st)), cur&&cur.sha, `Kantine: ${sent} Änderung${sent===1?"":"en"} (${S.email||"Gerät"})`);
        REMOTE={sha:res.content.sha, state:st}; PENDING=PENDING.slice(sent); needWrite=false; break;
      }catch(e){ if ((e.status===409 || e.status===422) && attempt<5) continue; throw e; }
    }
    lastSync=Date.now(); syncErr=""; S.offline=false;
    rebuild(); persist(); schedule(); publishSoon();
  }catch(e){
    S.offline=true;
    syncErr = e.status===401 ? "Zugangsschlüssel ungültig oder abgelaufen"
            : (e.status===403 || e.status===404) ? "Kein Zugriff auf das Daten-Repository"
            : (e.name==="OperationError") ? "Daten passen nicht zum Schlüssel dieses Geräts – bitte Gerät neu anmelden"
            : "Keine Verbindung";
  }finally{ syncing=false; updSync(); if (PENDING.length) scheduleSync(syncErr?30000:4000); }
}
function updSync(){
  const dot=$("#syncDot"), tx=$("#syncText"); if (!dot) return;
  const n=PENDING.length;
  dot.className = "dot" + (syncErr?" err":(n||syncing)?"":" on");
  tx.textContent = syncing ? "Gleiche ab …" : syncErr ? `${syncErr}${n?` · ${n} offen`:""}` : n ? `${n} Änderung${n===1?"":"en"} offen` : lastSync ? `Aktuell · ${new Date(lastSync).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}` : "Bereit";
}
const syncLabel = () => syncErr ? `Problem: ${syncErr}` : PENDING.length ? `${PENDING.length} Änderungen noch nicht abgeglichen` : lastSync ? `Zuletzt abgeglichen: ${tsStr(lastSync)}` : "Noch nicht abgeglichen";
setInterval(()=>{ if (MODE==="staff" && document.visibilityState==="visible" && Date.now()-lastSync>60000) syncNow(); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if (MODE==="staff" && document.visibilityState==="visible") syncNow(); });
window.addEventListener("online", ()=>{ if (MODE==="staff") syncNow(); });
window.addEventListener("beforeunload", e=>{ if (MODE==="staff" && PENDING.length){ syncNow(); e.preventDefault(); e.returnValue=""; } });

// --- Belege (verschlüsselt im Daten-Repository)
const assetsAdapter = {
  async upload(blob){
    const t=blob.type||"application/octet-stream";
    const o=await seal(DEK, new Uint8Array(await blob.arrayBuffer()));
    const path=`belege/${new Date().getFullYear()}/${Date.now()}-${randId(6)}.enc`;
    try{ await ghWrite(DATAREPO, path, tenc.encode(JSON.stringify({type:t, ...o})), null, "Beleg"); }
    catch(e){ throw {code: e.status===422?"too_large":"error", message:e.message}; }
    return {id:path};
  },
  async delete(path){ try{ const cur=await ghRead(DATAREPO, path); if (cur) await gh(`/repos/${OWNER}/${DATAREPO}/contents/${encPath(path)}`, {method:"DELETE", body:JSON.stringify({message:"Beleg gelöscht", sha:cur.sha})}); }catch(e){} return {deleted:true}; }
};
async function receiptBlobUrl(path){
  const cur=await ghRead(DATAREPO, path); if (!cur) throw new Error("nicht gefunden");
  const o=JSON.parse(tdec.decode(cur.bytes)); const bytes=await unseal(DEK, o);
  return {url:URL.createObjectURL(new Blob([bytes],{type:o.type})), pdf:o.type==="application/pdf"};
}

function qrSvg(text){ const q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true, alt:"QR-Code"}); }
async function makeCode(mid){ const code=randId(24); await api.set("codes", mid, {code}); return code; }
async function memberFile(code){

}
function memberSnapshot(mid){
